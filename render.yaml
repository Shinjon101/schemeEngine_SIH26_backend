# Render Blueprint for the Scheme Engine API.
# Secrets marked `sync: false` are prompted for in the Render dashboard.
services:
  - type: web
    name: scheme-engine-api
    runtime: node
    # --include=dev keeps TypeScript available even though NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      # Your Vercel URL(s), comma-separated, e.g.
      # https://your-app.vercel.app,https://your-app-*.vercel.app
      - key: CORS_ORIGINS
        sync: false
